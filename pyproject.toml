[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-trader"
version = "0.1.0"
description = "Autonomous Intelligent Trading System for Indian Markets"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "AI Trader Engineering Team" }
]
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.2.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pyarrow>=17.0.0",
    "fastparquet>=2024.5.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "pandas-stubs>=2.2.0",
    "pre-commit>=3.8.0",
    "pip-audit>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
